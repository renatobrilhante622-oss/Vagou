version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: vagou_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vagou_db
    ports:
      - "5432:5432"
    volumes:
      data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: vagou_redis
    ports:
      - "6379:6379"

volumes:
  data: