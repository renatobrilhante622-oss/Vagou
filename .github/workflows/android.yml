name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Android platform files safely
        run: |
          cp -r lib lib_backup
          cp pubspec.yaml pubspec_backup.yaml
          flutter create --platforms=android --org br.com.vagou .
          cp -r lib_backup/* lib/
          cp pubspec_backup.yaml pubspec.yaml
          rm -rf lib_backup pubspec_backup.yaml

      - name: Configure Android SDK 36 and Cleartext Traffic
        shell: python
        run: |
          import pathlib, re

          # 1. Libera tráfego HTTP local no AndroidManifest.xml
          manifest = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          if manifest.exists():
              txt = manifest.read_text(encoding="utf-8")
              if "usesCleartextTraffic" not in txt:
                  txt = txt.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
                  manifest.write_text(txt, encoding="utf-8")

          # 2. Configura compileSdk = 36 e minSdk = 24 no app/build.gradle[.kts]
          for p in [pathlib.Path("android/app/build.gradle.kts"), pathlib.Path("android/app/build.gradle")]:
              if p.exists():
                  content = p.read_text(encoding="utf-8")
                  if p.suffix == ".kts":
                      content = re.sub(r'compileSdk\s*=\s*[^\n]+', 'compileSdk = 36', content)
                      content = re.sub(r'targetSdk\s*=\s*[^\n]+', 'targetSdk = 36', content)
                      content = re.sub(r'minSdk\s*=\s*[^\n]+', 'minSdk = 24', content)
                  else:
                      content = re.sub(r'compileSdk\s+[^\n]+', 'compileSdk 36', content)
                      content = re.sub(r'compileSdkVersion\s+[^\n]+', 'compileSdkVersion 36', content)
                      content = re.sub(r'targetSdk\s+[^\n]+', 'targetSdk 36', content)
                      content = re.sub(r'minSdk\s+[^\n]+', 'minSdk 24', content)
                  p.write_text(content, encoding="utf-8")

          # 3. Força a versão do compileSdk diretamente nos blocos android das dependências se necessário
          local_properties = pathlib.Path("android/local.properties")
          if not local_properties.exists():
              local_properties.write_text("flutter.sdk=" + pathlib.Path("/opt/hostedtoolcache/flutter").as_posix())

      - name: Install dependencies and build APK
        run: |
          flutter pub get
          flutter build apk --release --dart-define=API_BASE_URL=http://192.168.18.128:8000

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vagou-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk