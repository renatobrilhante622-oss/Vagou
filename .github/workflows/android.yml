name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Complete missing Android scaffold without replacing configuration
        run: |
          set -euo pipefail
          scaffold="$RUNNER_TEMP/vagou-android-scaffold"
          flutter create --no-pub --platforms=android --org br.com.vagou --project-name vagou "$scaffold"
          rsync -a --ignore-existing "$scaffold/android/" android/
          chmod +x android/gradlew

      - name: Check Android SDK and HTTP configuration
        shell: python
        run: |
          import pathlib
          import re
          import xml.etree.ElementTree as ET

          app = pathlib.Path('android/app/build.gradle.kts').read_text()
          for key, expected in [('compileSdk', 36), ('targetSdk', 36), ('minSdk', 24)]:
              if not re.search(rf'^\s*{key}\s*=\s*{expected}\s*$', app, re.MULTILINE):
                  raise SystemExit(f'{key} must be {expected}')
          manifest = ET.parse('android/app/src/main/AndroidManifest.xml').getroot()
          android = '{http://schemas.android.com/apk/res/android}'
          application = manifest.find('application')
          if application is None or application.get(android + 'usesCleartextTraffic') != 'true':
              raise SystemExit('Local HTTP traffic must remain enabled')
          if not any(p.get(android + 'name') == 'android.permission.INTERNET' for p in manifest.findall('uses-permission')):
              raise SystemExit('INTERNET permission is required')

      - name: Install dependencies and build APK
        run: |
          set -euo pipefail
          flutter pub get
          dart format lib
          flutter analyze
          flutter test
          (cd android && ./gradlew verifyAndroidSdkConfiguration)
          flutter build apk --release --dart-define=API_BASE_URL=https://nest-gents-sudden.ngrok-free.dev

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vagou-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          compression-level: 0

  publish-apk:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: vagou-release-apk
          path: release

      - name: Publish APK as a direct release download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" release/app-release.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Vagou! $GITHUB_REF_NAME" \
            --notes 'APK Android para instalação. Consulte as notas e a configuração do ambiente no repositório.'
