name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Android platform files safely
        run: |
          cp -r lib lib_backup
          cp pubspec.yaml pubspec_backup.yaml
          flutter create --platforms=android --org br.com.vagou .
          cp -r lib_backup/* lib/
          cp pubspec_backup.yaml pubspec.yaml
          rm -rf lib_backup pubspec_backup.yaml

      - name: Force compileSdk 36 and HTTP Cleartext Traffic
        shell: python
        run: |
          import pathlib, re

          # 1. Libera tráfego HTTP local no AndroidManifest.xml
          manifest = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          if manifest.exists():
              txt = manifest.read_text(encoding="utf-8")
              if "usesCleartextTraffic" not in txt:
                  txt = txt.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
                  manifest.write_text(txt, encoding="utf-8")

          # 2. Força compileSdk = 36 e minSdk = 24 no build.gradle(.kts) do app
          for p in [pathlib.Path("android/app/build.gradle.kts"), pathlib.Path("android/app/build.gradle")]:
              if p.exists():
                  content = p.read_text(encoding="utf-8")
                  content = re.sub(r'compileSdk\s*=?\s*flutter\.compileSdkVersion', 'compileSdk = 36' if p.suffix == '.kts' else 'compileSdk 36', content)
                  content = re.sub(r'compileSdkVersion\s+flutter\.compileSdkVersion', 'compileSdkVersion 36', content)
                  content = re.sub(r'targetSdk\s*=?\s*flutter\.targetSdkVersion', 'targetSdk = 36' if p.suffix == '.kts' else 'targetSdk 36', content)
                  content = re.sub(r'minSdk\s*=?\s*flutter\.minSdkVersion', 'minSdk = 24' if p.suffix == '.kts' else 'minSdk 24', content)
                  content = re.sub(r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 24', content)
                  # Garante também substituição caso o Flutter use outro nome de variável
                  content = re.sub(r'compileSdk\s*=\s*\d+', 'compileSdk = 36', content)
                  p.write_text(content, encoding="utf-8")
                  print(f"Updated {p}")

          # 3. Força todos os subprojetos/plugins a compilarem com SDK 36
          root_kts = pathlib.Path("android/build.gradle.kts")
          if root_kts.exists():
              extra = """
          subprojects {
              afterEvaluate {
                  if (extensions.findByName("android") != null) {
                      extensions.configure<com.android.build.gradle.BaseExtension>("android") {
                          compileSdkVersion(36)
                      }
                  }
              }
          }
          """
              root_kts.write_text(root_kts.read_text(encoding="utf-8") + "\n" + extra, encoding="utf-8")

      - name: Install dependencies and build APK
        run: |
          flutter pub get
          flutter build apk --release --dart-define=API_BASE_URL=http://192.168.18.128:8000

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vagou-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk