name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Android platform files safely
        run: |
          cp -r lib lib_backup
          cp pubspec.yaml pubspec_backup.yaml
          flutter create --platforms=android --org br.com.vagou .
          cp -r lib_backup/* lib/
          cp pubspec_backup.yaml pubspec.yaml
          rm -rf lib_backup pubspec_backup.yaml

      - name: Force Android SDK 36 and Cleartext Traffic
        shell: python
        run: |
          import pathlib, re

          # 1. Libera tráfego HTTP local no AndroidManifest.xml
          manifest = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          if manifest.exists():
              txt = manifest.read_text(encoding="utf-8")
              if "usesCleartextTraffic" not in txt:
                  txt = txt.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
                  manifest.write_text(txt, encoding="utf-8")

          # 2. Força compileSdk = 36 e targetSdk = 36 no build.gradle(.kts) do app
          for p in [pathlib.Path("android/app/build.gradle.kts"), pathlib.Path("android/app/build.gradle")]:
              if p.exists():
                  content = p.read_text(encoding="utf-8")
                  content = re.sub(r'compileSdk\s*=?\s*[^\n]+', 'compileSdk = 36' if p.suffix == '.kts' else 'compileSdk 36', content)
                  content = re.sub(r'compileSdkVersion\s+[^\n]+', 'compileSdkVersion 36', content)
                  content = re.sub(r'targetSdk\s*=?\s*[^\n]+', 'targetSdk = 36' if p.suffix == '.kts' else 'targetSdk 36', content)
                  content = re.sub(r'targetSdkVersion\s+[^\n]+', 'targetSdkVersion 36', content)
                  content = re.sub(r'minSdk\s*=?\s*[^\n]+', 'minSdk = 24' if p.suffix == '.kts' else 'minSdk 24', content)
                  content = re.sub(r'minSdkVersion\s+[^\n]+', 'minSdkVersion 24', content)
                  p.write_text(content, encoding="utf-8")

          # 3. Adiciona propriedades globais do Android no gradle.properties para calar qualquer aviso de SDK
          props_path = pathlib.Path("android/gradle.properties")
          if props_path.exists():
              props = props_path.read_text(encoding="utf-8")
          else:
              props = ""
          
          extra_props = "\nandroid.useAndroidX=true\nandroid.enableJetifier=true\n"
          if "android.compileSdkVersion" not in props:
              extra_props += "android.compileSdkVersion=36\n"
          props_path.write_text(props + extra_props, encoding="utf-8")

      - name: Install dependencies and build APK
        run: |
          flutter pub get
          flutter build apk --release --dart-define=API_BASE_URL=http://192.168.18.128:8000

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vagou-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk