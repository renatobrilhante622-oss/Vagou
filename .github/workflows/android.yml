name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Android platform files if missing
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org br.com.vagou .
          fi

      - name: Allow HTTP cleartext traffic on Android
        run: |
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies and build APK
        run: |
          flutter pub get
          flutter build apk --release --dart-define=API_BASE_URL=http://192.168.18.128:8000

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vagou-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk